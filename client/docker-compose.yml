version: '3.8'

services:
  mcp-client:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"  # Web UI on port 8080
    environment:
      # Optional: Configure nginx to proxy /mcp to backend server
      - MCP_SERVER_URL=${MCP_SERVER_URL:-http://localhost:3000}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    labels:
      - "com.example.description=MCP Web Client - Browser interface for Model Context Protocol"
      - "com.example.service=mcp-client"
