version: "3.8"

services:
  # MCP Server - API backend with Playwright scraping
  mcp-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "3000:3000" # MCP API server
      - "5900:5900" # VNC port for browser debugging
      - "6080:6080" # noVNC web interface
    environment:
      - DISPLAY=:99
      - NODE_ENV=production
      - PLAYWRIGHT_HEADLESS=false
      # API Authentication (optional)
      # Generate: docker run --rm node:20-alpine node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      - MCP_API_KEYS=yolo
    volumes:
      - ./server/data:/app/domain-configs
    restart: unless-stopped
    stdin_open: true
    tty: true
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - mcp-network

  # MCP Client - Web UI
  mcp-client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "8080:80" # Web UI on port 8080
    environment:
      # MCP Server URL accessible from browser (not Docker network)
      # IMPORTANT: Must be accessible from the browser, not Docker internal DNS
      - MCP_SERVER_URL=${MCP_SERVER_URL:-http://localhost:3000}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost/",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    labels:
      - "com.example.description=MCP Web Client - Browser interface for Model Context Protocol"
      - "com.example.service=mcp-client"
    networks:
      - mcp-network

networks:
  mcp-network:
    driver: bridge
# Usage:
# 1. Build and start all services:
#    docker-compose up -d
#
# 2. View logs:
#    docker-compose logs -f
#
# 3. Access services:
#    - Web Client: http://localhost:8080
#    - MCP API: http://localhost:3000
#    - VNC Debug: http://localhost:6080
#
# 4. Stop services:
#    docker-compose down
#
# 5. With API authentication:
#    MCP_API_KEYS=your-key-here docker-compose up -d
