# Values file for deploying the MCP Server
# Usage: helm install cheerio-mcp-server ./deploy/web_search_mcp -f ./deploy/values-server.yaml

appType: server

replicaCount: 1

image:
  repository: registry.example.local/cheerio-mcp-server
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

# Enable VNC ports for server
vnc:
  enabled: true
  vncPort: 5900
  novncPort: 6080

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
  hosts:
    - host: mcp-api.example.local
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: cheerio-mcp-server-tls
      hosts:
        - mcp-api.example.local

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 512Mi

env:
  PORT: "3000"
  NODE_ENV: "production"
  LOG_LEVEL: "info"

# API Authentication (IMPORTANT!)
# Store API keys in Kubernetes secrets, not in this file
# Create secret: kubectl create secret generic mcp-api-keys --from-literal=MCP_API_KEYS="key1,key2,key3" -n cheerio-mcp
#
# Then uncomment and reference the secret:
# secrets:
#   MCP_API_KEYS: "your-secret-key-here"
#
# Or better, use an existing Kubernetes secret:
# In deployment template, add:
#   envFrom:
#     - secretRef:
#         name: mcp-api-keys
#
# Generate secure key:
#   kubectl run keygen --rm -it --restart=Never --image=node:20-alpine -- node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"

server:
  enabled: true
  playwright:
    headless: "false"

autoscaling:
  enabled: false
