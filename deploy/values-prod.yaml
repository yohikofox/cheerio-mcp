# Configuration pour environnement PRODUCTION
replicaCount: 3

image:
  repository: registry.example.local/cheerio-mcp
  tag: "1.0.0"
  pullPolicy: IfNotPresent

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: mcp.example.local
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: mcp-prod-tls
      hosts:
        - mcp.example.local

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 75

env:
  NODE_ENV: "production"
  LOG_LEVEL: "info"

nodeSelector:
  node-role: worker

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "3000"
  prometheus.io/path: "/metrics"
