# Configuration pour environnement DEV
replicaCount: 1

image:
  repository: registry.example.local/cheerio-mcp
  tag: "dev"
  pullPolicy: Always

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
  hosts:
    - host: mcp-dev.example.local
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: mcp-dev-tls
      hosts:
        - mcp-dev.example.local

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

autoscaling:
  enabled: false

env:
  NODE_ENV: "development"
  LOG_LEVEL: "debug"
