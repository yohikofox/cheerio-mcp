# Default values for cheerio-mcp
# This chart can deploy either the server or client based on the values provided
#
# Usage with Terraform:
#   resource "helm_release" "cheerio_mcp" {
#     name       = "cheerio-mcp-server"
#     chart      = "./deploy/web_search_mcp"
#     namespace  = "cheerio-mcp"
#
#     values = [yamlencode({
#       appType = "server"
#       image = {
#         repository = "registry.example.local/cheerio-mcp-server"
#         tag = "v1.0.0"
#       }
#       ingress = {
#         enabled = true
#         hosts = [{
#           host = "mcp-api.example.local"
#           paths = [{ path = "/", pathType = "Prefix" }]
#         }]
#       }
#     })]
#   }

# ============================================================================
# Application Configuration
# ============================================================================

# Application type: "server" or "client"
# This determines default configurations
# - server: MCP API server with Playwright (port 3000, VNC enabled)
# - client: Web UI served by nginx (port 80, VNC disabled)
appType: server

replicaCount: 1

# ============================================================================
# Image Configuration
# ============================================================================

image:
  # For server:
  repository: registry.example.local/cheerio-mcp-server
  # For client:
  # repository: registry.example.local/cheerio-mcp-client

  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# ============================================================================
# Service Account
# ============================================================================

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

# ============================================================================
# Pod Configuration
# ============================================================================

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
    - ALL

# ============================================================================
# Service Configuration
# ============================================================================

service:
  type: ClusterIP
  port: 80
  # Target port - adjust based on appType:
  # - server: 3000 (Node.js MCP server)
  # - client: 80 (nginx)
  targetPort: 3000
  annotations: {}

# ============================================================================
# Ingress Configuration
# ============================================================================

ingress:
  enabled: false
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"

  # Example for server:
  hosts:
    - host: mcp.example.local
      paths:
        - path: /
          pathType: Prefix

  # Example for client:
  # hosts:
  #   - host: mcp-ui.example.local
  #     paths:
  #       - path: /
  #         pathType: Prefix

  tls:
    - secretName: cheerio-mcp-tls
      hosts:
        - mcp.example.local

# ============================================================================
# Resources
# ============================================================================

# Default resources (adjust based on appType and environment)
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

# Server recommendations:
# resources:
#   limits:
#     cpu: 1000m
#     memory: 1Gi
#   requests:
#     cpu: 200m
#     memory: 512Mi

# Client recommendations:
# resources:
#   limits:
#     cpu: 200m
#     memory: 128Mi
#   requests:
#     cpu: 50m
#     memory: 64Mi

# ============================================================================
# Health Checks
# ============================================================================

# Default health checks (server: /health, client: /)
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# Client health checks (nginx doesn't have /health endpoint):
# livenessProbe:
#   httpGet:
#     path: /
#     port: http
#   initialDelaySeconds: 5
#   periodSeconds: 30
#   timeoutSeconds: 3
#   failureThreshold: 3
#
# readinessProbe:
#   httpGet:
#     path: /
#     port: http
#   initialDelaySeconds: 3
#   periodSeconds: 10
#   timeoutSeconds: 2
#   failureThreshold: 3

# ============================================================================
# Autoscaling
# ============================================================================

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max

# Client autoscaling example (more aggressive):
# autoscaling:
#   enabled: true
#   minReplicas: 2
#   maxReplicas: 5
#   targetCPUUtilizationPercentage: 70
#   targetMemoryUtilizationPercentage: 80

# ============================================================================
# Volumes
# ============================================================================

volumes: []
# Example: Persistent volume for domain configs
# volumes:
#   - name: domain-configs
#     persistentVolumeClaim:
#       claimName: mcp-domain-configs

volumeMounts: []
# Example: Mount domain configs
# volumeMounts:
#   - name: domain-configs
#     mountPath: /app/domain-configs

# ============================================================================
# Node Selection
# ============================================================================

nodeSelector: {}
# Example: Run on specific node pool
# nodeSelector:
#   node-role: worker

tolerations: []

affinity: {}
# Example: Prefer different nodes for HA
# affinity:
#   podAntiAffinity:
#     preferredDuringSchedulingIgnoredDuringExecution:
#     - weight: 100
#       podAffinityTerm:
#         labelSelector:
#           matchExpressions:
#           - key: app.kubernetes.io/name
#             operator: In
#             values:
#             - web-search-mcp
#         topologyKey: kubernetes.io/hostname

# ============================================================================
# Environment Variables
# ============================================================================

# Base environment variables (all deployments)
env:
  PORT: "3000"
  NODE_ENV: "production"
  LOG_LEVEL: "info"

# Server-specific env vars example:
# env:
#   PORT: "3000"
#   NODE_ENV: "production"
#   LOG_LEVEL: "info"
#   DISPLAY: ":99"
#   PLAYWRIGHT_HEADLESS: "false"

# Development environment example:
# env:
#   PORT: "3000"
#   NODE_ENV: "development"
#   LOG_LEVEL: "debug"

# ConfigMap data (will be converted to env vars)
# Use for non-sensitive configuration
config: {}
# Example:
# config:
#   MAX_CONCURRENT_REQUESTS: "50"
#   CACHE_TTL: "3600"

# ============================================================================
# Secrets
# ============================================================================

# Secret data (will be converted to env vars)
# IMPORTANT: Store API keys in Kubernetes secrets, not in values files
#
# Best practice: Create secret separately and reference it
#   kubectl create secret generic mcp-api-keys \
#     --from-literal=MCP_API_KEYS="key1,key2,key3" \
#     -n cheerio-mcp
#
# Then in deployment template, add:
#   envFrom:
#     - secretRef:
#         name: mcp-api-keys
#
# Or use this for testing only (NOT production):
# secrets:
#   MCP_API_KEYS: "your-secret-key-here"
secrets: {}

# ============================================================================
# VNC Configuration (Server Only)
# ============================================================================

# VNC ports for server (only applicable when appType: server)
# These will only be exposed if appType is server
# Used for debugging Playwright browser sessions
vnc:
  enabled: true
  vncPort: 5900
  novncPort: 6080

# Disable for client:
# vnc:
#   enabled: false

# ============================================================================
# Server-Specific Configuration
# ============================================================================

server:
  # Playwright configuration
  playwright:
    headless: "false"
  # External ConfigMap and Secret (created by Terraform)
  # These resources are expected to exist and will be referenced via envFrom
  # Set to empty string ("") to disable external resources
  externalConfigMap: "mcp-server-config"
  externalSecret: "mcp-server-secrets"

# Example when appType: server
# server:
#   playwright:
#     headless: "false"
#   # To disable external resources, set to empty string:
#   # externalConfigMap: ""
#   # externalSecret: ""

# ============================================================================
# Client-Specific Configuration
# ============================================================================

client:
  # Server connection configuration
  # When deploying with appType: client, specify the server service name
  # The MCP_SERVER_URL will be auto-generated using Kubernetes DNS
  server:
    # Name of the server service (required when appType: client)
    serviceName: ""
    # Namespace where the server is deployed (empty = same namespace)
    namespace: ""
    # Server port (default: 3000)
    port: 3000
    # Protocol (http or https)
    protocol: "http"

# Example when appType: client
# client:
#   server:
#     serviceName: "cheerio-mcp-server"  # Name of your server release
#     namespace: ""  # Same namespace
#     port: 3000
#     protocol: "http"

