# Default values for cheerio-mcp
# This chart can deploy either the server or client based on the values provided

replicaCount: 1

# Application type: server or client
# This determines default configurations
appType: server

image:
  repository: registry.example.local/cheerio-mcp-server
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
    - ALL

# Service configuration
service:
  type: ClusterIP
  port: 80
  # Target port - defaults based on appType
  # server: 3000, client: 80
  targetPort: 3000
  annotations: {}

# Ingress configuration
ingress:
  enabled: false
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
  hosts:
    - host: mcp.example.local
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: cheerio-mcp-tls
      hosts:
        - mcp.example.local

# Resource limits
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

# Health checks
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# Autoscaling
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max

# Additional volumes
volumes: []

# Additional volumeMounts
volumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}

# Environment variables
env:
  PORT: "3000"
  NODE_ENV: "production"
  LOG_LEVEL: "info"

# ConfigMap data (will be converted to env vars)
config: {}

# Secret data (will be converted to env vars)
# IMPORTANT: Store API keys in Kubernetes secrets, not in values files
# Example:
# secrets:
#   MCP_API_KEYS: "key1,key2,key3"
secrets: {}

# VNC ports for server (only applicable when appType: server)
# These will only be exposed if appType is server
vnc:
  enabled: true
  vncPort: 5900
  novncPort: 6080

# Server-specific configuration
server:
  enabled: false
  # Additional server-specific settings
  playwright:
    headless: "false"

# Client-specific configuration
client:
  enabled: false
  # Additional client-specific settings
