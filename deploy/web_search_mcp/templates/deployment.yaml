apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "web-search-mcp.fullname" . }}
  labels:
    {{- include "web-search-mcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ .Values.appType }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "web-search-mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "web-search-mcp.labels" . | nindent 8 }}
        app.kubernetes.io/component: {{ .Values.appType }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "web-search-mcp.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: {{ .Chart.Name }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 12 }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.service.targetPort }}
          protocol: TCP
        {{- if and (eq .Values.appType "server") .Values.vnc.enabled }}
        - name: vnc
          containerPort: {{ .Values.vnc.vncPort }}
          protocol: TCP
        - name: novnc
          containerPort: {{ .Values.vnc.novncPort }}
          protocol: TCP
        {{- end }}
        env:
        {{- range $key, $value := .Values.env }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        {{- if eq .Values.appType "server" }}
        {{- if .Values.server.playwright }}
        - name: PLAYWRIGHT_HEADLESS
          value: {{ .Values.server.playwright.headless | quote }}
        {{- end }}
        - name: DISPLAY
          value: ":99"
        {{- end }}
        {{- if and (eq .Values.appType "client") .Values.client.server.serviceName }}
        - name: MCP_SERVER_URL
          value: {{ include "web-search-mcp.mcpServerUrl" . | quote }}
        {{- end }}
        {{- if or .Values.config .Values.secrets (and (eq .Values.appType "server") (or .Values.server.externalConfigMap .Values.server.externalSecret)) }}
        envFrom:
        {{- if .Values.config }}
        - configMapRef:
            name: {{ include "web-search-mcp.fullname" . }}
        {{- end }}
        {{- if .Values.secrets }}
        - secretRef:
            name: {{ include "web-search-mcp.fullname" . }}
        {{- end }}
        {{- if eq .Values.appType "server" }}
        {{- if .Values.server.externalConfigMap }}
        - configMapRef:
            name: {{ .Values.server.externalConfigMap }}
        {{- end }}
        {{- if .Values.server.externalSecret }}
        - secretRef:
            name: {{ .Values.server.externalSecret }}
        {{- end }}
        {{- end }}
        {{- end }}
        {{- if .Values.livenessProbe }}
        livenessProbe:
          {{- toYaml .Values.livenessProbe | nindent 12 }}
        {{- end }}
        {{- if .Values.readinessProbe }}
        readinessProbe:
          {{- toYaml .Values.readinessProbe | nindent 12 }}
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
        {{- with .Values.volumeMounts }}
        volumeMounts:
          {{- toYaml . | nindent 12 }}
        {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
