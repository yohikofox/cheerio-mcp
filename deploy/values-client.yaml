# Values file for deploying the MCP Client (Web UI)
# Usage: helm install cheerio-mcp-client ./deploy/web_search_mcp -f ./deploy/values-client.yaml

appType: client

replicaCount: 2

image:
  repository: registry.example.local/cheerio-mcp-client
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 80
  targetPort: 80

# Disable VNC ports for client
vnc:
  enabled: false

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: mcp.example.local
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: cheerio-mcp-client-tls
      hosts:
        - mcp.example.local

resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

# No special env vars needed for nginx
env: {}

# Client doesn't need health checks on /health (nginx doesn't have this endpoint by default)
livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 30
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 3
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

client:
  enabled: true

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
