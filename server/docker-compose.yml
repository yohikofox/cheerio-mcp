version: '3.8'

services:
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"  # MCP server
      - "5900:5900"  # VNC port
      - "6080:6080"  # noVNC web interface
    environment:
      - DISPLAY=:99
      - NODE_ENV=production
      - PLAYWRIGHT_HEADLESS=false
    volumes:
      - ./data:/app/domain-configs
    restart: unless-stopped
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
