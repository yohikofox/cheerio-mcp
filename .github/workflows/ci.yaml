name: CI/CD Cheerio MCP

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - main

env:
  VERSION: "1.0.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

run-name: "[${{ github.event_name }}] ${{ github.event.head_commit.message }} - by @${{ github.actor }}"

permissions:
  contents: write
  packages: write

jobs:
  build-server:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Git Version
        id: version
        uses: codacy/git-version@2.7.1
        with:
          release-branch: main
          dev-branch: develop

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker login
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push Server Docker image
        uses: docker/build-push-action@v5
        with:
          push: true
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
          file: "Dockerfile"
          context: "{{defaultContext}}:server"
          tags: |
            ${{ secrets.REGISTRY_SERVER }}/cheerio-mcp-server:${{ github.sha }}
            ${{ secrets.REGISTRY_SERVER }}/cheerio-mcp-server:${{ steps.version.outputs.version }}
            ${{ secrets.REGISTRY_SERVER }}/cheerio-mcp-server:latest

  build-client:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Git Version
        id: version
        uses: codacy/git-version@2.7.1
        with:
          release-branch: main
          dev-branch: develop

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker login
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push Client Docker image
        uses: docker/build-push-action@v5
        with:
          push: true
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client
          file: "Dockerfile"
          context: "{{defaultContext}}:client"
          tags: |
            ${{ secrets.REGISTRY_SERVER }}/cheerio-mcp-client:${{ github.sha }}
            ${{ secrets.REGISTRY_SERVER }}/cheerio-mcp-client:${{ steps.version.outputs.version }}
            ${{ secrets.REGISTRY_SERVER }}/cheerio-mcp-client:latest

  deploy:
    environment:
      name: ${{ github.ref_name }}
    runs-on: ubuntu-latest
    needs: [build-server, build-client]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Git Version
        id: version
        uses: codacy/git-version@2.7.1
        with:
          release-branch: main
          dev-branch: develop

      - name: Create Helm values file
        run: |
          echo '${{ vars.HELM_VALUES }}' > helm-values.yaml

      - name: Deploy Server to cluster
        uses: wahyd4/kubectl-helm-action@master
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG }}
        with:
          args: |
            helm upgrade -i cheerio-mcp-server "./deploy/web_search_mcp" \
              --namespace="${{ vars.NAMESPACE }}" \
              --create-namespace \
              --timeout=120s \
              --set appType="server" \
              --set image.repository="${{ secrets.REGISTRY_SERVER }}/cheerio-mcp-server" \
              --set image.tag="${{ github.sha }}" \
              --set image.pullPolicy="IfNotPresent" \
              --set service.targetPort="3000" \
              --set vnc.enabled="true" \
              --set ingress.enabled="true"

      - name: Deploy Client to cluster
        uses: wahyd4/kubectl-helm-action@master
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG }}
        with:
          args: |
            helm upgrade -i cheerio-mcp-client "./deploy/web_search_mcp" \
              --namespace="${{ vars.NAMESPACE }}" \
              --create-namespace \
              --timeout=120s \
              --set appType="client" \
              --set image.repository="${{ secrets.REGISTRY_SERVER }}/cheerio-mcp-client" \
              --set image.tag="${{ github.sha }}" \
              --set image.pullPolicy="IfNotPresent" \
              --set service.targetPort="80" \
              --set vnc.enabled="false" \
              --set ingress.enabled="true"
