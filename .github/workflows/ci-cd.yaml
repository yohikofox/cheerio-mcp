name: CI/CD Web Search MCP

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - main

env:
  VERSION: "1.0.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

run-name: "[${{ github.event_name }}] ${{ github.event.head_commit.message }} - by @${{ github.actor }}"

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Git Version
        id: version
        uses: codacy/git-version@2.7.1
        with:
          release-branch: main
          dev-branch: develop

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker login
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          file: "Dockerfile"
          context: "{{defaultContext}}:."
          tags: |
            ${{ secrets.REGISTRY_SERVER }}/cheerio-mcp:${{ github.sha }}
            ${{ secrets.REGISTRY_SERVER }}/cheerio-mcp:${{ steps.version.outputs.version }}
            ${{ secrets.REGISTRY_SERVER }}/cheerio-mcp:latest

  deploy:
    environment:
      name: ${{ github.ref_name }}
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Git Version
        id: version
        uses: codacy/git-version@2.7.1
        with:
          release-branch: main
          dev-branch: develop

      - name: Create Helm values file
        run: |
          echo '${{ vars.HELM_VALUES }}' > helm-values.yaml

      - name: Deploy to cluster
        uses: wahyd4/kubectl-helm-action@master
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG }}
        with:
          args: |
            helm upgrade -i web-search-mcp "./deploy/web_search_mcp" \
              --namespace="${{ vars.NAMESPACE }}" \
              --create-namespace \
              --timeout=120s \
              --set image.repository="${{ secrets.REGISTRY_SERVER }}/cheerio-mcp" \
              --set image.tag="${{ github.sha }}" \
              --set image.pullPolicy="IfNotPresent"
